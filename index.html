<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Activités Interactives</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="conteneur">
    <h1>Mes Activités Interactives</h1>

    <!-- ACTIVITÉ 1 -->
    <section class="carte">
      <h2>1. Générateur de messages gentils</h2>
      <p>Écris un prénom pour recevoir une belle pensée :</p>
      <input type="text" id="champ-nom" placeholder="Ex: Alex">
      <button id="btn-generer">Générer un message</button>
      <p id="resultat-message" class="resultat"></p>
    </section>

    <!-- ACTIVITÉ 2 -->
    <section class="carte">
      <h2>2. Le défi du cercle parfait</h2>
      <p>Dessine un cercle autour du point bleu sans lever le doigt ou la souris !</p>
      <canvas id="zone-cercle" width="320" height="320"></canvas>
      <p id="resultat-cercle" class="resultat">Trace ton cercle pour voir ton score</p>
      <button id="btn-effacer">Effacer / Recommencer</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
